name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          npm install -g @anthropic-ai/claude-code
      - name: Lint shell files
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning skills/executing-plans/tests/bin/codex
      - name: Test Codex session script
        run: skills/executing-plans/tests/test-codex-session.sh
      - name: Test retro scripts
        run: python3 skills/session-retro/tests/test_retro_mine.py
      - name: Validate skills
        run: |
          for skill in skills/*; do
            npx --yes skills-ref@0.1.5 validate "$skill"
          done
      - name: Check generated agents
        run: python3 scripts/build-agents.py --check
      - name: Check manifest versions
        run: python3 scripts/check-versions.py
      - name: Validate Claude plugin
        run: claude plugin validate .
